<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <h2>Ad Blocker Controls</h2>

        <div class="stat-box">
            <span class="stat-label">Elements Blocked:</span>
            <span id="blocked-count" class="stat-value">0</span>
        </div>

        <hr>

        <div class="control-row">
            <label for="toggle-blocker">Enable Ad Blocker</label>
            <input type="checkbox" id="toggle-blocker" checked>
        </div>

        <button id="whitelist-btn" class="btn">Whitelist This Site</button>
        <div id="whitelist-status"></div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
